name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  py:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Execute repository-owned quorum proof
        run: bash scripts/ci/verify_elite_core.sh
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-gradient-quorum-${{ matrix.python-version }}
          path: .verification-artifacts/
          if-no-files-found: error
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: clang -O2 -std=c11 -Wall -Wextra -o /tmp/ctest native/*_test.c -lm && /tmp/ctest
